<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#2c6b3f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Carnet de ferme</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une colonne mobile, en-tête de ferme, contenu en listes de registre, navigation fixe en bas, formulaires en feuille glissante */
:root{
  --bg:#eef1ea; --surface:#fbfcf8; --surface2:#e3e9dd; --ink:#18241b; --muted:#566559; --line:#cdd6c6;
  --accent:#2c6b3f; --accent-ink:#ffffff; --accent-soft:#d5e8d6;
  --ochre:#9a6008; --ochre-soft:#f3e3c4; --bad:#b23a2b; --bad-soft:#f4d9d3;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif; --f-body:'Figtree',system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101611; --surface:#182019; --surface2:#222d24; --ink:#e7eee6; --muted:#9bab9d; --line:#2e3b30;
  --accent:#6fbf86; --accent-ink:#0c1a10; --accent-soft:#1f3a29;
  --ochre:#e0a64a; --ochre-soft:#3a2d12; --bad:#ec8071; --bad-soft:#42201b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101611; --surface:#182019; --surface2:#222d24; --ink:#e7eee6; --muted:#9bab9d; --line:#2e3b30;
  --accent:#6fbf86; --accent-ink:#0c1a10; --accent-soft:#1f3a29;
  --ochre:#e0a64a; --ochre-soft:#3a2d12; --bad:#ec8071; --bad-soft:#42201b; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
#app{max-width:640px;margin:0 auto}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 6px}
.brand{min-width:0}
.brand h1{font:700 22px/1.15 var(--f-display);overflow-wrap:anywhere;text-wrap:balance}
.brand p{color:var(--muted);font-size:13px;text-transform:capitalize}
.who{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 0 6px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);cursor:pointer;max-width:50%}
.who .wn{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 15px var(--f-display);flex:none}
.av.big{width:48px;height:48px;font-size:20px}
.warn-banner{margin-top:10px;padding:10px 12px;border-radius:var(--r);background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:14px}
.demo-banner{margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--ochre-soft);color:var(--ink);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-block:14px 4px}
.seg button{flex:1;min-width:0;min-height:40px;border:0;background:transparent;border-radius:9px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-block:18px 10px}
.head h2{font:700 18px/1.2 var(--f-display)}
.page-t{font:700 20px var(--f-display);margin-block:18px 4px}
h3.sub{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-block:16px 8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;margin-block:12px}
.card h3{font:700 16px var(--f-display)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.pf{display:flex;align-items:center;gap:12px}
.pf strong{display:block}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.list>.row:last-child{border-bottom:0}
.row.tap{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit;cursor:pointer}
.list>.row.tap:last-child{border-bottom:0}
.rbody{flex:1;min-width:0;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:0;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.rbody.static{cursor:inherit}
.rbody strong{overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--muted);font-size:13px;align-items:center}
.meta em{font-style:normal;font-weight:600}
.meta em.bad{color:var(--bad)}
.meta em.warn{color:var(--ochre)}
.right{flex:none;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.right small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.empty{padding:18px 14px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center;background:var(--surface)}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.pill.good{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--ochre-soft);color:var(--ochre)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

.btn{min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn.bad{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sq{min-width:40px;padding:0;font-size:20px;line-height:1}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink)}
.chip b{font-variant-numeric:tabular-nums}
button.chip{cursor:pointer;min-height:36px}
button.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-block:14px}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat b.sm{font-size:19px;padding-block:4px}
.stat span{font-size:13px;color:var(--muted)}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.alert .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--muted)}
.alert.bad .dot{background:var(--bad)}
.alert.warn .dot{background:var(--ochre)}
.alert.info .dot{background:var(--accent)}
.alert.ok{cursor:default;color:var(--muted)}

.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);background:transparent;color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;padding:0}
.task.done .chk{background:var(--accent);border-color:var(--accent)}
.task.done .rbody strong{text-decoration:line-through;color:var(--muted)}

.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.low i{background:var(--bad)}
.row.wrapr{flex-wrap:wrap}
.row.wrapr .bar{flex-basis:100%}
.qty{flex:none;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.qty b{font:700 20px var(--f-display)}
.qty span{display:block;font-size:12px;color:var(--muted)}
.mv{display:flex;gap:6px;flex:none}

.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-block:4px 10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.legend .v{background:var(--accent)}
.legend .d{background:var(--ochre)}
.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.bars{height:110px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid var(--line)}
.bars i{flex:1;min-height:2px;border-radius:3px 3px 0 0}
.bars i.v{background:var(--accent)}
.bars i.d{background:var(--ochre)}
.mcol span{display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:4px;text-transform:capitalize}
.catrow{display:flex;flex-direction:column;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line)}
.list>.catrow:last-child{border-bottom:0}
.catrow div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.catrow b{font-variant-numeric:tabular-nums}
.bar.o i{background:var(--ochre)}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.monthbar strong{font:700 17px var(--f-display);text-transform:capitalize;text-align:center;flex:1}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;
  background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:600;border-radius:10px;cursor:pointer}
.nav button.on{color:var(--accent);background:var(--accent-soft)}

#sheet{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;background:var(--surface);color:var(--ink);border-radius:18px 18px 0 0;
  max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.sheet-h h2{font:700 18px var(--f-display)}
.sheet-b{overflow-y:auto;overscroll-behavior:contain;padding:8px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.sheet-f .btn.primary{flex:1;max-width:260px}

.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:16px var(--f-body);padding:10px 12px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chk-l{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--ink);min-height:40px}
.chk-l input{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex:none}
.total-out{font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-weight:600;font-size:14px}

.gate{min-height:85vh;min-height:85dvh;display:flex;align-items:center;justify-content:center;padding-block:28px}
.gate-in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.gate-in h1{font:700 30px/1.1 var(--f-display);text-wrap:balance}
.userbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
.list>.userbtn:last-child{border-bottom:0}
.pinform{display:flex;flex-direction:column;gap:12px}
.note{font-size:13px;color:var(--muted)}
textarea.mono{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}

.syncpill{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:2px 10px;min-height:28px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--muted);font:600 12px var(--f-body);text-transform:none;cursor:pointer;vertical-align:middle}
.syncpill i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.syncpill.ok i{background:var(--accent)}
.syncpill.busy i,.syncpill.pending i,.syncpill.offline i{background:var(--ochre)}
.syncpill.err i,.syncpill.denied i{background:var(--bad)}
.ro .wbtn,.ro .mv{display:none}
.ro .rbody,.ro .row.tap,.ro .chk{pointer-events:none;cursor:default}
.ro .chk{opacity:.55}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:60;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

</head><body>
<div id="app"></div>
<div id="sheet" hidden></div>

/* ---------- Données ---------- */
var DB=null, storageOK=true;
var EMPTY=function(){return {v:1,farm:{name:'Ma ferme',currency:'FCFA'},users:[],animals:[],health:[],feeds:[],crops:[],acts:[],stock:[],moves:[],expenses:[],sales:[],tasks:[],journal:{}}};
function migrate(d){var e=EMPTY();for(var k in e){if(d[k]===undefined)d[k]=e[k]}return d}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.users))return migrate(d)}}catch(e){storageOK=false}return null}
function saveRaw(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){storageOK=false}}
function save(){saveRaw();if(SY.on){detect();saveSY();syncSoon()}}
var S={uid:null,tab:'home',sub:{home:'jour',animals:'liste',crops:'cultures',stock:'tous',fin:'resume'},month:0,loginFor:null,pinErr:false,showDone:false};
var VIEWER={id:'__viewer__',name:'Observateur',role:'observer',pin:null};
var me=function(){if(S.uid==='__viewer__'&&SY.role==='view')return VIEWER;return DB&&DB.users.find(function(u){return u.id===S.uid})};
var isOwner=function(){var u=me();return !!u&&u.role==='owner'&&SY.role!=='view'};
var RO=function(){var u=me();return !!u&&(u.role==='observer'||SY.role==='view')};
var roleL=function(r){return r==='owner'?'Propriétaire':r==='observer'?'Observateur':'Employé'};
function put(col,x,o){if(x){Object.assign(x,o)}else{var n=Object.assign({id:uid(),at:Date.now(),by:me().name},o);DB[col].push(n)}save()}
function rm(col,x){DB[col]=DB[col].filter(function(i){return i!==x});save()}
var animalName=function(id){return (!id||id==='all')?'Tous les animaux':((DB.animals.find(function(a){return a.id===id})||{}).nom||'Animal supprimé')};
var cropName=function(id){return (DB.crops.find(function(c){return c.id===id})||{}).nom||'Culture supprimée'};
var isLow=function(s){return num(s.seuil)>0&&num(s.qte)<=num(s.seuil)};
function applyOut(stockId,qty,date,note){
  var it=DB.stock.find(function(s){return s.id===stockId});if(!it)return null;
  var q=Math.min(qty,it.qte);if(qty>it.qte)toast('Stock insuffisant : '+it.nom+' passe à 0.');
  it.qte=round(it.qte-q);
  var m={id:uid(),stockId:stockId,type:'out',qty:q,date:date,note:note,at:Date.now(),by:me().name};DB.moves.push(m);return m.id}
function undoMove(moveId){
  var i=DB.moves.findIndex(function(m){return m.id===moveId});if(i<0)return;
  var m=DB.moves[i],it=DB.stock.find(function(s){return s.id===m.stockId});
  if(it)it.qte=Math.max(0,round(it.qte+(m.type==='out'?m.qty:-m.qty)));
  DB.moves.splice(i,1)}
function finData(k){
  var s=DB.sales.filter(function(x){return (x.date||'').indexOf(k)===0}),e=DB.expenses.filter(function(x){return (x.date||'').indexOf(k)===0});
  var sv=s.reduce(function(a,x){return a+num(x.total)},0),ev=e.reduce(function(a,x){return a+num(x.montant)},0);
  return {s:s,e:e,sv:sv,ev:ev,solde:sv-ev}}
var COLS=['animals','health','feeds','crops','acts','stock','moves','expenses','sales','tasks'];
function hasDemo(){return COLS.some(function(c){return DB[c].some(function(x){return x.demo})})||Object.keys(DB.journal).some(function(k){return DB.journal[k].demo})}
function clearDemo(){
  COLS.forEach(function(c){DB[c]=DB[c].filter(function(x){return !x.demo})});
  Object.keys(DB.journal).forEach(function(k){if(DB.journal[k].demo)delete DB.journal[k]});
  DB.moves=DB.moves.filter(function(m){return DB.stock.some(function(s){return s.id===m.stockId})});
  save()}

/* ---------- Composants ---------- */
function fld(label,name,val,o){
  o=o||{};val=val==null?'':val;var t=o.type||'text';
  if(t==='select')return '<label class="f"><span>'+label+'</span><select name="'+name+'" id="f-'+name+'">'+o.options.map(function(x){var v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return '<option value="'+esc(v)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(l)+'</option>'}).join('')+'</select></label>';
  if(t==='textarea')return '<label class="f"><span>'+label+'</span><textarea name="'+name+'" id="f-'+name+'" rows="3"'+(o.attrs?' '+o.attrs:'')+'>'+esc(val)+'</textarea></label>';
  return '<label class="f"><span>'+label+'</span><input name="'+name+'" id="f-'+name+'" type="'+t+'" value="'+esc(val)+'"'+(o.attrs?' '+o.attrs:'')+'></label>'}
var dl=function(id,arr){return '<datalist id="'+id+'">'+arr.map(function(x){return '<option value="'+esc(x)+'"></option>'}).join('')+'</datalist>'};
var NUM='type="number" ';
var two=function(a,b){return '<div class="two">'+a+b+'</div>'};
var head=function(t,b,a,extra){return '<div class="head"><h2>'+t+'</h2>'+(b&&!RO()?'<button class="btn small primary" data-act="'+a+'" '+(extra||'')+'>'+ico('plus',16)+' '+b+'</button>':'')+'</div>'};
var empty=function(t){return '<div class="empty">'+t+'</div>'};
var rowTap=function(act,id,main,sub,right){return '<button class="row tap" data-act="'+act+'" data-id="'+esc(id)+'"><span class="rbody static"><strong>'+main+'</strong><span class="meta">'+sub+'</span></span>'+(right?'<span class="right">'+right+'</span>':'')+'</button>'};
var sp=function(a){return a.filter(Boolean).map(function(x){return '<span>'+x+'</span>'}).join('')};
var seg=function(key,items){return '<div class="seg" role="tablist">'+items.map(function(it){var on=S.sub[key]===it[0];return '<button role="tab" aria-selected="'+on+'" class="'+(on?'on':'')+'" data-act="sub" data-key="'+key+'" data-v="'+it[0]+'">'+it[1]+'</button>'}).join('')+'</div>'};
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2800)}
function arm(el,label,fn){
  if(el.dataset.armed){fn();return}
  el.dataset.armed='1';var o=el.textContent;el.textContent=label;el.classList.add('armed');
  setTimeout(function(){if(el.isConnected){delete el.dataset.armed;el.textContent=o;el.classList.remove('armed')}},4000)}

var sheetSave=null,sheetDel=null;
function openForm(title,body,onSave,o){if(RO()&&!(o&&o.ro)){toast('Lecture seule : modification impossible.');return}
  o=o||{};
  $('#sheet').innerHTML='<div class="scrim" data-act="close"></div><form class="sheet" data-form="sheet" autocomplete="off"><div class="sheet-h"><h2>'+title+'</h2><button type="button" class="btn small" data-act="close" aria-label="Fermer">Fermer</button></div><div class="sheet-b">'+body+'</div><div class="sheet-f">'+(o.del?'<button type="button" class="btn bad" data-act="sheet-del">Supprimer</button>':'')+'<button class="btn primary" type="submit">'+(o.ok||'Enregistrer')+'</button></div></form>';
  sheetSave=onSave;sheetDel=o.del||null;$('#sheet').hidden=false;document.body.classList.add('lock');
  if(o.init)o.init($('#sheet form'))}
function closeSheet(){var s=$('#sheet');s.hidden=true;s.innerHTML='';document.body.classList.remove('lock');sheetSave=null;sheetDel=null}

/* ---------- Vues principales ---------- */
function render(){
  var app=$('#app');
  if(!DB||(!DB.users.length&&SY.role!=='view')){app.innerHTML=setupView();return}
  if(!me()){app.innerHTML=loginView();return}
  if(S.tab==='fin'&&!isOwner())S.tab='home';try{document.body.classList.toggle('ro',RO())}catch(e){}
  app.innerHTML=topbar()+'<main>'+view()+'</main>'+nav()}
function topbar(){
  var u=me();
  return '<header class="top"><div class="brand"><h1>'+esc(DB.farm.name)+'</h1><p>'+esc(fdate(today(),true))+pill()+'</p></div><button class="who" data-act="goto" data-tab="settings" aria-label="Profil et réglages"><span class="av">'+esc(u.name.trim().charAt(0).toUpperCase())+'</span><span class="wn">'+esc(u.name)+'</span></button></header>'
   +(storageOK?'':'<div class="warn-banner">L’enregistrement est bloqué dans ce navigateur. Les données seront perdues à la fermeture. Copiez une sauvegarde depuis les réglages.</div>')}
function nav(){
  var tabs=[['home','Accueil','home'],['animals','Animaux','paw'],['crops','Cultures','sprout'],['stock','Stocks','box']];
  if(isOwner())tabs.push(['fin','Finances','coin']);
  return '<nav class="nav" style="--n:'+tabs.length+'">'+tabs.map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" data-act="goto" data-tab="'+t[0]+'" aria-current="'+(S.tab===t[0]?'page':'false')+'">'+ico(t[2])+'<span>'+t[1]+'</span></button>'}).join('')+'</nav>'}
function view(){
  switch(S.tab){case 'home':return homeView();case 'animals':return animalsView();case 'crops':return cropsView();case 'stock':return stockView();case 'fin':return finView();case 'settings':return settingsView()}
  return ''}

   +DB.users.map(function(u){return '<button class="userbtn" data-act="pick-user" data-id="'+u.id+'"><span class="av">'+esc(u.name.trim().charAt(0).toUpperCase())+'</span><span class="rbody static"><strong>'+esc(u.name)+'</strong><span class="meta">'+sp([roleL(u.role),u.pin?'Code PIN':''])+'</span></span></button>'}).join('')+'</div>'

   +'</div></div>'}

/* ---------- Accueil ---------- */
function homeView(){
  var sub=S.sub.home;
  return (hasDemo()&&!RO()?'<div class="demo-banner"><span>Des données d’exemple sont affichées.</span><button class="btn small" data-act="demo-clear">Supprimer les exemples</button></div>':'')
   +seg('home',[['jour','Aujourd’hui'],['taches','Tâches'],['journal','Journal']])
   +(sub==='jour'?homeJour():sub==='taches'?homeTasks():homeJournal())}
function taskRow(x){
  var t=today(),due='',cls='';
  if(x.due){var d=diffDays(x.due,t);if(!x.done&&d<0){due='En retard · '+(-d)+' j';cls='bad'}else if(d===0){due='Aujourd’hui';cls='warn'}else if(d===1)due='Demain';else due=fdate(x.due)}
  var who=(x.assignee&&x.assignee!=='all')?((DB.users.find(function(u){return u.id===x.assignee})||{}).name||''):'Tous';
  return '<div class="row task'+(x.done?' done':'')+'"><button class="chk" data-act="task-toggle" data-id="'+x.id+'" aria-label="'+(x.done?'Rouvrir':'Terminer')+' la tâche" aria-pressed="'+!!x.done+'">'+(x.done?ico('check',18):'')+'</button><button class="rbody" data-act="task-edit" data-id="'+x.id+'"><strong>'+esc(x.title)+'</strong><span class="meta">'+(due?'<em class="'+cls+'">'+due+'</em>':'')+sp([esc(who),x.repeat?'↻ '+REPEAT_L[x.repeat]:''])+'</span></button></div>'}
function homeJour(){
  var t=today(),u=me(),own=isOwner();
  var animaux=DB.animals.filter(function(a){return a.statut==='Actif'}).reduce(function(s,a){return s+num(a.effectif)},0);
  var mine=function(x){return !x.assignee||x.assignee==='all'||x.assignee===u.id};
  var due=DB.tasks.filter(function(x){return !x.done&&x.due&&x.due<=t&&mine(x)}).sort(function(a,b){return a.due.localeCompare(b.due)});
  var low=DB.stock.filter(isLow),j=DB.journal[t];
  var fourth=own?'<div class="stat"><b class="sm">'+money(finData(mkey(0)).solde)+'</b><span>solde du mois</span></div>':'<div class="stat"><b class="sm">'+(j?'Fait':'À faire')+'</b><span>suivi du jour</span></div>';
  var al=[];
  low.forEach(function(s){al.push({sev:'bad',txt:esc(s.nom)+' : '+fmtN(s.qte)+' '+esc(s.unite||'')+' restant',tab:'stock'})});
  DB.health.filter(function(h){return h.rappel&&!h.rappelDone&&h.rappel<=addDays(t,7)}).sort(function(a,b){return a.rappel.localeCompare(b.rappel)}).forEach(function(h){
    var d=diffDays(h.rappel,t);al.push({sev:d<0?'bad':'warn',txt:esc(h.type)+' · '+esc(animalName(h.animalId))+' — '+(d<0?'en retard de '+(-d)+' j':d===0?'aujourd’hui':'dans '+d+' j'),tab:'animals',key:'animals',v:'sante'})});
  var late=DB.tasks.filter(function(x){return !x.done&&x.due&&x.due<t&&mine(x)}).length;
  if(late)al.push({sev:'bad',txt:late+' tâche'+(late>1?'s':'')+' en retard',tab:'home',key:'home',v:'taches'});
  DB.crops.filter(function(c){return c.recolte&&['Semé','En croissance'].indexOf(c.statut)>=0&&c.recolte<=addDays(t,14)}).forEach(function(c){
    var d=diffDays(c.recolte,t);al.push({sev:'warn',txt:'Récolte '+esc(c.nom)+' '+(d<0?'dépassée de '+(-d)+' j':d===0?'aujourd’hui':'dans '+d+' j'),tab:'crops'})});
  if(!j&&!RO())al.push({sev:'info',txt:'Le suivi du jour n’est pas encore rempli',act:'journal-new'});
  var alHtml=al.length?al.map(function(a){return '<button class="alert '+a.sev+'" '+(a.act?'data-act="'+a.act+'"':'data-act="goto" data-tab="'+a.tab+'"'+(a.key?' data-key="'+a.key+'" data-v="'+a.v+'"':''))+'><i class="dot"></i><span>'+a.txt+'</span></button>'}).join(''):'<div class="alert ok"><i class="dot"></i><span>Rien d’urgent pour le moment.</span></div>';
  return '<div class="stats"><div class="stat"><b>'+fmtN(animaux)+'</b><span>animaux actifs</span></div><div class="stat"><b>'+due.length+'</b><span>tâche'+(due.length>1?'s':'')+' du jour</span></div><div class="stat"><b>'+low.length+'</b><span>stock'+(low.length>1?'s':'')+' bas</span></div>'+fourth+'</div>'
   +'<h3 class="sub">À surveiller</h3><div class="alerts">'+alHtml+'</div>'
   +head('Tâches du jour','Tâche','task-new')
   +(due.length?'<div class="list">'+due.map(taskRow).join('')+'</div>':empty('Aucune tâche prévue pour aujourd’hui.'))
   +head('Suivi journalier')
   +(j?'<div class="list">'+journalRow(t)+'</div>':(RO()?'<div class="empty">Le suivi du jour n’est pas encore rempli.</div>':'<button class="btn primary" data-act="journal-new" style="width:100%">Remplir le suivi du jour</button>'))}
function homeTasks(){
  var t=today(),open=DB.tasks.filter(function(x){return !x.done}),done=DB.tasks.filter(function(x){return x.done}).sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0)}).slice(0,15);
  var g={late:[],today:[],soon:[],none:[]};
  open.sort(function(a,b){return (a.due||'9999').localeCompare(b.due||'9999')}).forEach(function(x){if(!x.due)g.none.push(x);else if(x.due<t)g.late.push(x);else if(x.due===t)g.today.push(x);else g.soon.push(x)});
  var sec=function(l,a){return a.length?'<h3 class="sub">'+l+'</h3><div class="list">'+a.map(taskRow).join('')+'</div>':''};
  return head('Tâches','Nouvelle','task-new')+(open.length?sec('En retard',g.late)+sec('Aujourd’hui',g.today)+sec('À venir',g.soon)+sec('Sans date',g.none):empty('Aucune tâche en cours. Ajoutez les travaux à faire, avec une répétition si besoin.'))
   +(done.length?'<div style="margin-top:16px"><button class="btn small" data-act="toggle-done">'+(S.showDone?'Masquer':'Afficher')+' les tâches terminées ('+done.length+')</button></div>'+(S.showDone?'<div class="list" style="margin-top:10px">'+done.map(taskRow).join('')+'</div>':''):'')}
function taskForm(id){
  var x=DB.tasks.find(function(t){return t.id===id});
  openForm(x?'Modifier la tâche':'Nouvelle tâche',
    fld('Tâche','title',x&&x.title,{attrs:'required placeholder="Ex. Vacciner les poussins"'})
    +two(fld('Échéance','due',x?x.due:today(),{type:'date'}),fld('Répétition','repeat',x&&x.repeat,{type:'select',options:[['','Aucune'],['day','Chaque jour'],['week','Chaque semaine'],['month','Chaque mois']]}))
    +fld('Assignée à','assignee',x?x.assignee:'all',{type:'select',options:[['all','Tous']].concat(DB.users.map(function(u){return [u.id,u.name]}))}),
    function(d){if(!d.title.trim())return false;put('tasks',x,{title:d.title.trim(),due:d.due,repeat:d.repeat,assignee:d.assignee});if(!x)DB.tasks[DB.tasks.length-1].done=false;save();render()},
    x?{del:function(){rm('tasks',x);render()}}:{})}
function journalRow(k){
  var e=DB.journal[k],n=CHECKS.filter(function(c){return e.checks&&e.checks[c[0]]}).length,m=num(e.mort);
  return rowTap('journal-edit',k,esc(fdateY(k)),sp([esc(e.meteo||''),n+'/'+CHECKS.length+' contrôles',(e.prod&&num(e.prod.qty)>0)?esc(e.prod.label||'Production')+' '+fmtN(num(e.prod.qty)):'']),m>0?'<span class="pill bad">'+fmtN(m)+' perte'+(m>1?'s':'')+'</span>':'')}
function homeJournal(){
  var keys=Object.keys(DB.journal).sort().reverse().slice(0,30);
  return head('Suivi journalier','Nouveau','journal-new')+(keys.length?'<div class="list">'+keys.map(journalRow).join('')+'</div>':empty('Aucun suivi enregistré. Notez chaque jour la météo, les contrôles faits, la production et les pertes.'))}
function journalForm(date){
  var k=date||today(),e=DB.journal[k];
  var checks=CHECKS.map(function(c){return '<label class="chk-l"><input type="checkbox" name="c_'+c[0]+'"'+(e&&e.checks&&e.checks[c[0]]?' checked':'')+'><span>'+c[1]+'</span></label>'}).join('');
  openForm(e?'Suivi du '+esc(fdate(k)):'Suivi du jour',

/* ---------- Synchronisation en ligne ---------- */
var SYKEY='carnet-de-ferme-sync-v1';
var SY={on:false,url:'',key:'',farm:'',access:'',viewKey:'',role:'edit',lastPull:0,offset:0,snap:{},meta:{},dirty:{},last:0,status:'off',err:''};
var SY_SAVED=['on','url','key','farm','access','viewKey','role','lastPull','offset','snap','meta','dirty','last'];
var KNOWN=COLS.concat(['users','journal','farm']);
var SQL_TEXT="-- Carnet de ferme : script de synchronisation.\n-- \u00c0 ex\u00e9cuter UNE SEULE FOIS dans Supabase (SQL Editor), puis toucher \"Run\".\n-- Les donn\u00e9es ne sont jamais lisibles directement : tout passe par des fonctions\n-- prot\u00e9g\u00e9es par un code secret (code \"modification\" ou code \"lecture seule\").\n\ncreate table if not exists public.cf_farms (\n  id uuid primary key default gen_random_uuid(),\n  edit_hash text not null,\n  view_hash text not null,\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.cf_records (\n  farm_id uuid not null references public.cf_farms(id) on delete cascade,\n  col text not null,\n  rid text not null,\n  data jsonb,\n  deleted boolean not null default false,\n  client_u bigint not null default 0,\n  updated_at timestamptz not null default now(),\n  primary key (farm_id, col, rid)\n);\n\ncreate index if not exists cf_records_pull on public.cf_records (farm_id, updated_at);\n\nalter table public.cf_farms enable row level security;\nalter table public.cf_records enable row level security;\nrevoke all on public.cf_farms from anon, authenticated;\nrevoke all on public.cf_records from anon, authenticated;\n\ncreate or replace function public.cf_hash(t text) returns text\nlanguage sql immutable as $$\n  select encode(sha256(convert_to(t, 'utf8')), 'hex')\n$$;\n\ncreate or replace function public.cf_role(p_farm uuid, p_key text) returns text\nlanguage sql stable security definer set search_path = public as $$\n  select case\n    when edit_hash = public.cf_hash(p_key) then 'edit'\n    when view_hash = public.cf_hash(p_key) then 'view'\n    else null\n  end\n  from public.cf_farms where id = p_farm\n$$;\n\ncreate or replace function public.cf_create_farm(p_edit text, p_view text) returns uuid\nlanguage plpgsql security definer set search_path = public as $$\ndeclare v_id uuid;\nbegin\n  if p_edit is null or p_view is null or length(p_edit) < 16 or length(p_view) < 16 or p_edit = p_view then\n    raise exception 'codes invalides';\n  end if;\n  insert into public.cf_farms (edit_hash, view_hash)\n  values (public.cf_hash(p_edit), public.cf_hash(p_view))\n  returning id into v_id;\n  return v_id;\nend\n$$;\n\ncreate or replace function public.cf_pull(p_farm uuid, p_key text, p_since bigint) returns jsonb\nlanguage plpgsql security definer set search_path = public as $$\ndeclare v_role text; v_recs jsonb;\nbegin\n  v_role := public.cf_role(p_farm, p_key);\n  if v_role is null then raise exception 'acces refuse'; end if;\n  select coalesce(jsonb_agg(jsonb_build_object('c', col, 'i', rid, 'd', data, 'x', deleted, 'u', client_u)), '[]'::jsonb)\n    into v_recs\n    from public.cf_records\n   where farm_id = p_farm\n     and updated_at > to_timestamp(greatest(coalesce(p_since, 0), 0) / 1000.0)\n     and (v_role = 'edit' or col not in ('users', 'sales', 'expenses'));\n  return jsonb_build_object(\n    'role', v_role,\n    'now', floor(extract(epoch from clock_timestamp()) * 1000)::bigint,\n    'records', v_recs\n  );\nend\n$$;\n\ncreate or replace function public.cf_push(p_farm uuid, p_key text, p_records jsonb) returns integer\nlanguage plpgsql security definer set search_path = public as $$\ndeclare r jsonb; n integer := 0;\nbegin\n  if public.cf_role(p_farm, p_key) is distinct from 'edit' then raise exception 'acces refuse'; end if;\n  if jsonb_typeof(p_records) <> 'array' or jsonb_array_length(p_records) > 500 then\n    raise exception 'envoi invalide';\n  end if;\n  for r in select value from jsonb_array_elements(p_records) loop\n    insert into public.cf_records (farm_id, col, rid, data, deleted, client_u, updated_at)\n    values (\n      p_farm, r->>'c', r->>'i', r->'d',\n      coalesce((r->>'x')::boolean, false),\n      coalesce((r->>'u')::bigint, 0),\n      now()\n    )\n    on conflict (farm_id, col, rid) do update\n      set data = excluded.data,\n          deleted = excluded.deleted,\n          client_u = excluded.client_u,\n          updated_at = now()\n      where public.cf_records.client_u <= excluded.client_u;\n    n := n + 1;\n  end loop;\n  return n;\nend\n$$;\n\ncreate or replace function public.cf_rotate(p_farm uuid, p_key text, p_edit text, p_view text) returns boolean\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if public.cf_role(p_farm, p_key) is distinct from 'edit' then raise exception 'acces refuse'; end if;\n  if p_edit is null or p_view is null or length(p_edit) < 16 or length(p_view) < 16 or p_edit = p_view then\n    raise exception 'codes invalides';\n  end if;\n  update public.cf_farms\n     set edit_hash = public.cf_hash(p_edit), view_hash = public.cf_hash(p_view)\n   where id = p_farm;\n  return true;\nend\n$$;\n\nrevoke execute on function public.cf_hash(text) from public, anon, authenticated;\nrevoke execute on function public.cf_role(uuid, text) from public, anon, authenticated;\ngrant execute on function public.cf_create_farm(text, text) to anon, authenticated;\ngrant execute on function public.cf_pull(uuid, text, bigint) to anon, authenticated;\ngrant execute on function public.cf_push(uuid, text, jsonb) to anon, authenticated;\ngrant execute on function public.cf_rotate(uuid, text, text, text) to anon, authenticated;\n\nnotify pgrst, 'reload schema';\n";
function loadSY(){try{var r=localStorage.getItem(SYKEY);if(r){var d=JSON.parse(r);SY_SAVED.forEach(function(k){if(d[k]!==undefined)SY[k]=d[k]})}}catch(e){}SY.status=SY.on?'idle':'off'}
function saveSY(){try{var o={};SY_SAVED.forEach(function(k){o[k]=SY[k]});localStorage.setItem(SYKEY,JSON.stringify(o))}catch(e){}}
function resetSY(){SY.on=false;SY.url='';SY.key='';SY.farm='';SY.access='';SY.viewKey='';SY.role='edit';SY.lastPull=0;SY.offset=0;SY.snap={};SY.meta={};SY.dirty={};SY.last=0;SY.status='off';SY.err=''}
function canon(v){return JSON.stringify(v,function(k,val){if(val&&typeof val==='object'&&!Array.isArray(val)){var o={};Object.keys(val).sort().forEach(function(key){o[key]=val[key]});return o}return val})}
function enumerate(){
  var o={},add=function(c,i,d){o[c+'|'+i]={c:c,i:i,d:d,h:hash(canon(d))}};
  COLS.concat(['users']).forEach(function(c){if(SY.role==='view'&&c==='users')return;(DB[c]||[]).forEach(function(x){if(x&&x.id)add(c,x.id,x)})});
  Object.keys(DB.journal||{}).forEach(function(k){add('journal',k,DB.journal[k])});
  add('farm','farm',DB.farm);
  return o}
function nowU(){return Date.now()+(SY.offset||0)}
function detect(){
  if(!SY.on||!DB)return;
  var cur=enumerate(),now=nowU(),k;
  for(k in cur){
    if(SY.snap[k]===cur[k].h){delete SY.dirty[k]}
    else if(SY.dirty[k]!==cur[k].h){SY.meta[k]=now;SY.dirty[k]=cur[k].h}
  }
  for(k in SY.snap){
    if(SY.snap[k]!=='x'&&!(k in cur)&&SY.dirty[k]!=='x'){SY.meta[k]=now;SY.dirty[k]='x'}
  }
}
function hasDirty(){return Object.keys(SY.dirty).length>0}
function isNet(e){return !!e&&(e.name==='TypeError'||e.name==='AbortError')}
function rpc(fn,body,cfg){
  cfg=cfg||SY;
  var h={'Content-Type':'application/json',apikey:cfg.key};
  if(/^eyJ/.test(cfg.key))h.Authorization='Bearer '+cfg.key;
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  var to=ctl?setTimeout(function(){ctl.abort()},25000):0;
  var done=function(){if(to)clearTimeout(to)};
  return fetch(cfg.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body),signal:ctl?ctl.signal:undefined}).then(function(r){
    return r.text().then(function(t){
      done();
      var j=null;try{j=t?JSON.parse(t):null}catch(e){}
      if(!r.ok){var er=new Error((j&&(j.message||j.hint||j.error_description))||('Erreur '+r.status));er.status=r.status;er.code=j&&j.code;throw er}
      return j})
  },function(e){done();throw e})}
function friendlyErr(e){
  var m=(e&&e.message)||'';
  if(/acces refuse/i.test(m))return 'Code refusé. Demandez une nouvelle invitation.';
  if(/PGRST202|Could not find the function|schema cache/i.test(m+' '+((e&&e.code)||'')))return 'Le script SQL n’a pas été exécuté dans Supabase.';
  if(isNet(e))return 'Connexion impossible. Vérifiez internet et l’adresse du projet.';
  if(e&&(e.status===401||e.status===403))return 'Clé publique refusée. Vérifiez la clé copiée.';
  return m||'Erreur inconnue.'}
function setRec(r){
  if(r.c==='journal'){DB.journal[r.i]=r.d;return}
  if(r.c==='farm'){Object.assign(DB.farm,r.d);return}
  var arr=DB[r.c];if(!Array.isArray(arr))return;
  for(var i=0;i<arr.length;i++){
    if(arr[i].id===r.i){var o=arr[i];Object.keys(o).forEach(function(k){delete o[k]});Object.assign(o,r.d);return}
  }
  arr.push(r.d)}
function applyRecords(list){
  var any=false;
  (list||[]).forEach(function(r){
    if(!r||KNOWN.indexOf(r.c)<0)return;
    var k=r.c+'|'+r.i,known=(SY.snap[k]!==undefined||SY.dirty[k]!==undefined);
    if(known&&r.u<=(SY.meta[k]||0))return;
    if(r.x){

      else if(r.c!=='farm'&&Array.isArray(DB[r.c]))DB[r.c]=DB[r.c].filter(function(x){return x.id!==r.i});

function pushPending(){
  detect();

  Object.keys(SY.dirty).forEach(function(k){
    var p=k.indexOf('|'),c=k.slice(0,p),i=k.slice(p+1);
    if(SY.dirty[k]==='x'){items.push({c:c,i:i,d:null,x:true,u:SY.meta[k]});marks.push([k,'x'])}
    else if(cur[k]){items.push({c:c,i:i,d:cur[k].d,x:false,u:SY.meta[k]});marks.push([k,cur[k].h])}
  });
  var chain=Promise.resolve();
  for(var s=0;s<items.length;s+=150){(function(from){
    chain=chain.then(function(){
      return rpc('cf_push',{p_farm:SY.farm,p_key:SY.access,p_records:items.slice(from,from+150)}).then(function(){
        marks.slice(from,from+150).forEach(function(m){if(SY.dirty[m[0]]===m[1]){SY.snap[m[0]]=m[1];delete SY.dirty[m[0]]}})})})
  })(s)}
  return chain}
function statusText(){
  var n=Object.keys(SY.dirty).length;
  switch(SY.status){
    case 'ok':return 'Synchronisé';
    case 'busy':return 'Synchronisation…';
    case 'pending':return n+' à envoyer';
    case 'offline':return n?('Hors connexion · '+n+' à envoyer'):'Hors connexion';
    case 'denied':return 'Accès refusé';
    case 'err':return 'Erreur de synchronisation';
    default:return 'Synchronisation'}}
function pill(){if(!SY.on)return '';return '<button class="syncpill '+SY.status+'" data-act="sync-now" aria-label="Synchroniser maintenant"><i></i>'+esc(statusText())+'</button>'}
function updatePill(){var el=$('.syncpill');if(el){el.className='syncpill '+SY.status;el.innerHTML='<i></i>'+esc(statusText())}}
function setStatus(s,err){SY.status=s;SY.err=err||'';updatePill()}
var syncing=false,syncAgain=false,syncTimer=null,syncStarted=false;
function syncSoon(){clearTimeout(syncTimer);syncTimer=setTimeout(function(){syncNow()},1500)}
function syncNow(){
  if(!SY.on||!DB)return Promise.resolve();
  if(syncing){syncAgain=true;return Promise.resolve()}
  if(typeof navigator!=='undefined'&&navigator.onLine===false){detect();saveSY();setStatus('offline');return Promise.resolve()}
  syncing=true;setStatus('busy');detect();
  var changed=false;
  return rpc('cf_pull',{p_farm:SY.farm,p_key:SY.access,p_since:Math.max(0,(SY.lastPull||0)-10000)}).then(function(res){
    SY.role=res.role;SY.offset=res.now-Date.now();
    changed=applyRecords(res.records);
    SY.lastPull=res.now;
    if(changed)saveRaw();
    if(SY.role==='view')return;
    return pushPending()
  }).then(function(){
    SY.last=Date.now();saveSY();
    setStatus(hasDirty()?'pending':'ok');
    if(changed)render();
  }).then(null,function(e){
    saveSY();
    var msg=friendlyErr(e);
    setStatus(/acces refuse/i.test((e&&e.message)||'')?'denied':(isNet(e)?'offline':'err'),msg);
  }).then(function(){syncing=false;if(syncAgain){syncAgain=false;syncSoon()}})}
function startSync(){
  if(!SY.on||syncStarted)return;
  syncStarted=true;setStatus('idle');syncSoon();
  setInterval(function(){if(SY.on&&!document.hidden)syncNow()},45000);
  window.addEventListener('online',function(){if(SY.on)syncNow()});
  document.addEventListener('visibilitychange',function(){if(SY.on&&!document.hidden)syncNow()})}
function genKey(){
  var al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='',a=new Uint8Array(24),i;
  try{crypto.getRandomValues(a)}catch(e){for(i=0;i<24;i++)a[i]=Math.floor(Math.random()*256)}
  for(i=0;i<24;i++)s+=al[a[i]%al.length];
  return s}
function cleanUrl(u){return String(u||'').trim().replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,'')}
function invitation(type){
  var o={u:SY.url,k:SY.key,f:SY.farm,a:type==='view'?SY.viewKey:SY.access};
  if(type!=='view'&&SY.viewKey)o.v=SY.viewKey;
  return 'CF1.'+btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeInvite(text){
  var m=/CF1\.([A-Za-z0-9_-]+)/.exec(text||'');if(!m)return null;
  try{
    var b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    var o=JSON.parse(decodeURIComponent(escape(atob(b))));
    return (o&&o.u&&o.k&&o.f&&o.a)?o:null
  }catch(e){return null}}
function createFarm(d){
  var url=cleanUrl(d.url),key=String(d.key||'').trim();
  if(!/^https:\/\/\S+$/.test(url)||key.length<20)return Promise.reject(new Error('Adresse ou clé invalide.'));
  var ek=genKey(),vk=genKey();
  return rpc('cf_create_farm',{p_edit:ek,p_view:vk},{url:url,key:key}).then(function(id){
    SY.on=true;SY.url=url;SY.key=key;SY.farm=id;SY.access=ek;SY.viewKey=vk;SY.role='edit';
    SY.lastPull=0;SY.offset=0;SY.snap={};SY.meta={};SY.dirty={};SY.last=0;SY.err='';
    detect();saveSY();startSync();
    return syncNow()})}
function joinFarm(text){
  var o=decodeInvite(text);
  if(!o)return Promise.reject(new Error('Invitation invalide. Collez le texte reçu en entier.'));
  var cfg={url:cleanUrl(o.u),key:o.k};
  return rpc('cf_pull',{p_farm:o.f,p_key:o.a,p_since:0},cfg).then(function(res){
    DB=EMPTY();resetSY();
    SY.on=true;SY.url=cfg.url;SY.key=cfg.key;SY.farm=o.f;SY.access=o.a;SY.viewKey=o.v||'';SY.role=res.role;
    SY.offset=res.now-Date.now();
    applyRecords(res.records);
    SY.lastPull=res.now;SY.last=Date.now();
    S.uid=SY.role==='view'?'__viewer__':null;S.loginFor=null;S.tab='home';
    saveRaw();saveSY();setStatus('ok');startSync()})}
function rotateKeys(){
  var ek=genKey(),vk=genKey();
  return rpc('cf_rotate',{p_farm:SY.farm,p_key:SY.access,p_edit:ek,p_view:vk}).then(function(){SY.access=ek;SY.viewKey=vk;saveSY()})}
function copyText(text,ta,msg){
  var fb=function(){if(ta){ta.focus();ta.select()}toast('Sélectionnez le texte puis copiez-le.')};
  try{navigator.clipboard.writeText(text).then(function(){toast(msg||'Copié.')},fb)}catch(e){fb()}}
function syncCard(){
  if(!SY.on)return '<section class="card"><h3>Synchronisation en ligne</h3><p class="note">Partagez les données entre plusieurs téléphones. L’application continue de fonctionner sans connexion et se met à jour dès que le réseau revient.</p><div class="btns"><button class="btn primary" data-act="sync-setup">Activer la synchronisation</button></div></section>';
  var last=SY.last?new Date(SY.last).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'jamais';
  return '<section class="card"><h3>Synchronisation en ligne</h3><p class="note">État : <b>'+esc(statusText())+'</b> · dernière synchronisation : '+esc(last)+'</p>'+(SY.err?'<p class="err">'+esc(SY.err)+'</p>':'')
   +'<div class="btns"><button class="btn" data-act="sync-now">Synchroniser maintenant</button></div>'
   +'<h3>Inviter</h3><p class="note">Créez d’abord le profil de la personne dans Utilisateurs, puis envoyez-lui une invitation. « Modifier » convient aux employés et aux autres propriétaires. « Observateur » donne une lecture seule, sans les finances ni la liste des utilisateurs.</p>'
   +'<div class="btns"><button class="btn" data-act="invite" data-t="edit">Inviter pour modifier</button><button class="btn" data-act="invite" data-t="view">Inviter un observateur</button></div>'
   +'<p class="note">Si une invitation est perdue ou mal utilisée, renouvelez les codes : les anciennes invitations cessent de fonctionner et il faut réinviter chaque téléphone.</p>'
   +'<div class="btns"><button class="btn" data-act="sync-rotate">Renouveler les codes</button><button class="btn bad" data-act="sync-off">Désactiver ici</button></div></section>'}
function viewerSettings(){
  return '<h2 class="page-t">Réglages</h2><section class="card"><h3>Mode observateur</h3><p class="note">Vous consultez la ferme en lecture seule. Les données se mettent à jour automatiquement quand le téléphone est connecté.</p><p class="note">État : <b>'+esc(statusText())+'</b></p><div class="btns"><button class="btn" data-act="sync-now">Actualiser</button><button class="btn bad" data-act="sync-leave">Quitter cette ferme</button></div></section>'}
function syncSetupForm(){
  openForm('Activer la synchronisation',
    '<ol class="steps"><li>Créez un compte gratuit sur <b>supabase.com</b>, puis un projet (« New project »). Choisissez une région proche, par exemple en Europe.</li><li>Dans le menu du projet, ouvrez <b>SQL Editor</b>, collez le script copié avec le bouton ci-dessous, puis touchez <b>Run</b>.</li><li>Touchez <b>Connect</b> en haut du projet : copiez l’adresse du projet et la clé « publishable ». Elles sont aussi dans <b>Settings &gt; API Keys</b>.</li><li>Collez-les ci-dessous.</li></ol><button type="button" class="btn" data-act="copy-sql">Copier le script SQL</button>'
    +fld('Adresse du projet','url','',{attrs:'required placeholder="https://xxxx.supabase.co" inputmode="url"'})
    +fld('Clé publique (publishable ou anon)','key','',{attrs:'required'}),
    function(d){
      var btn=$('#sheet button[type=submit]');if(btn){btn.disabled=true;btn.textContent='Création…'}
      createFarm(d).then(function(){
        closeSheet();render();
        toast(SY.status==='ok'?'Synchronisation activée.':('Ferme créée. '+(SY.err||'')))
      },function(e){
        if(btn){btn.disabled=false;btn.textContent='Créer la ferme en ligne'}
        toast(friendlyErr(e))});
      return false},
    {ok:'Créer la ferme en ligne'})}
function joinForm(){
  openForm('Rejoindre une ferme',
    '<p class="note">Collez l’invitation reçue du propriétaire. Les données de ce téléphone seront remplacées par celles de la ferme.</p>'+fld('Invitation','code','',{type:'textarea',attrs:'required placeholder="CF1...."'}),
    function(d){
      var btn=$('#sheet button[type=submit]');if(btn){btn.disabled=true;btn.textContent='Connexion…'}
      joinFarm(d.code).then(function(){closeSheet();render();toast('Ferme rejointe.')},function(e){
        if(btn){btn.disabled=false;btn.textContent='Rejoindre'}
        toast(friendlyErr(e))});
      return false},
    {ok:'Rejoindre'})}
function inviteForm(type){
  var view=type==='view';
  if(view&&!SY.viewKey){toast('Cette invitation se crée depuis le téléphone qui a activé la synchronisation.');return}
  var txt='Invitation Carnet de ferme · '+DB.farm.name+'\nAccès : '+(view?'lecture seule (observateur)':'modification')+'\nCode : '+invitation(type)+'\nOuvrez l’application, touchez « J’ai un code d’invitation » et collez ce texte.';
  openForm(view?'Inviter un observateur':'Inviter pour modifier',
    '<p class="note">'+(view?'Cet accès permet de tout consulter sauf les finances et les utilisateurs. Rien ne peut être modifié.':'Cet accès permet de modifier les données. La personne se connecte ensuite avec son profil dans Utilisateurs.')+'</p><textarea class="mono" id="f-invite" rows="7" readonly>'+esc(txt)+'</textarea><p class="note">Envoyez ce texte par message. Toute personne qui le reçoit obtient cet accès : ne le publiez pas.</p>',
    function(){copyText(txt,$('#f-invite'),'Invitation copiée.');return false},{ok:'Copier'})}

/* ---------- Actions ---------- */
var acts={
  close:function(){closeSheet()},
  'sync-setup':function(){syncSetupForm()},
  'copy-sql':function(){copyText(SQL_TEXT,null,'Script copié. Collez-le dans SQL Editor.')},
  'sync-now':function(){syncNow()},
  join:function(){joinForm()},
  invite:function(d){inviteForm(d.t)},
  'sync-rotate':function(d,el){arm(el,'Confirmer : anciens codes révoqués',function(){rotateKeys().then(function(){render();toast('Nouveaux codes créés. Réinvitez les autres téléphones.')},function(e){toast(friendlyErr(e))})})},
  'sync-off':function(d,el){arm(el,'Confirmer la désactivation',function(){resetSY();saveSY();render();toast('Synchronisation désactivée sur ce téléphone.')})},
  'sync-leave':function(d,el){arm(el,'Confirmer : quitter la ferme',function(){try{localStorage.removeItem(KEY);localStorage.removeItem(SYKEY)}catch(e){}DB=null;resetSY();S.uid=null;S.tab='home';render();window.scrollTo(0,0)})},
  'sheet-del':function(d,el){arm(el,'Confirmer la suppression',function(){var f=sheetDel;closeSheet();if(f)f()})},
  goto:function(d){S.tab=d.tab;if(d.key)S.sub[d.key]=d.v;render();window.scrollTo(0,0)},
  sub:function(d){S.sub[d.key]=d.v;render()},
  month:function(d){S.month+=+d.d;render()},
  'toggle-done':function(){S.showDone=!S.showDone;render()},
  'task-new':function(){taskForm()},'task-edit':function(d){taskForm(d.id)},
  'task-toggle':function(d){
    var x=DB.tasks.find(function(t){return t.id===d.id});if(!x)return;
    x.done=!x.done;x.doneAt=x.done?Date.now():null;x.doneBy=x.done?me().name:null;
    if(x.done&&x.repeat){
      var base=x.due||today(),step=x.repeat==='day'?1:x.repeat==='week'?7:0;
      var n=step?addDays(base,step):addMonths(base,1);
      if(n<=today())n=step?addDays(today(),step):addMonths(today(),1);
      DB.tasks.push({id:uid(),title:x.title,due:n,repeat:x.repeat,assignee:x.assignee,done:false,at:Date.now(),by:x.by})}
    save();render()},
  'journal-new':function(){journalForm()},'journal-edit':function(d){journalForm(d.id)},
  'animal-new':function(){animalForm()},'animal-edit':function(d){animalForm(d.id)},
  'health-new':function(){healthForm()},'health-edit':function(d){healthForm(d.id)},
  'health-done':function(d){var h=DB.health.find(function(x){return x.id===d.id});if(h){h.rappelDone=true;save();render();toast('Rappel marqué comme fait.')}},
  'feed-new':function(){feedForm()},'feed-edit':function(d){feedForm(d.id)},
  'crop-new':function(){cropForm()},'crop-edit':function(d){cropForm(d.id)},
  'act-new':function(d){actForm(null,d.crop||DB.crops[0]&&DB.crops[0].id)},'act-edit':function(d){actForm(d.id)},
  'stock-new':function(){stockForm()},'stock-edit':function(d){stockForm(d.id)},'move':function(d){moveForm(d.id,d.type)},
  'sale-new':function(){saleForm()},'sale-edit':function(d){saleForm(d.id)},
  'exp-new':function(){expForm()},'exp-edit':function(d){expForm(d.id)},
  'farm-edit':function(){farmForm()},'user-new':function(){userForm()},'user-edit':function(d){userForm(d.id)},'pin-change':function(){pinForm()},
  backup:function(){backupForm()},restore:function(){restoreForm()},
  logout:function(){S.uid=null;S.loginFor=null;S.tab='home';render();window.scrollTo(0,0)},
  'pick-user':function(d){
    var u=DB.users.find(function(x){return x.id===d.id});if(!u)return;
    if(!u.pin){S.uid=u.id;S.tab='home';render()}
    else{S.loginFor=u.id;S.pinErr=false;render();var i=$('#f-pin');if(i)i.focus()}},
  'demo-clear':function(d,el){arm(el,'Confirmer la suppression',function(){clearDemo();render();toast('Exemples supprimés.')})},
  reset:function(d,el){arm(el,'Confirmer : tout effacer',function(){try{localStorage.removeItem(KEY);localStorage.removeItem(SYKEY)}catch(e){}DB=null;resetSY();S.uid=null;S.tab='home';render();window.scrollTo(0,0)})}
};
var forms={
  sheet:function(d){var r=sheetSave?sheetSave(d):undefined;if(r!==false)closeSheet()},
  setup:function(d){
    var name=d.farm.trim(),user=d.user.trim();if(!name||!user)return;
    if(d.pin&&!/^\d{4}$/.test(d.pin)){toast('Le code PIN doit avoir 4 chiffres.');return}
    DB=EMPTY();DB.farm={name:name,currency:(d.currency||'FCFA').trim()};
    var id=uid();DB.users.push({id:id,name:user,role:'owner',pin:d.pin?pinHash(d.pin,id):null});
    S.uid=id;S.tab='home';if(d.demo)seedDemo();save();render();window.scrollTo(0,0)},
  pin:function(d){
    var u=DB.users.find(function(x){return x.id===S.loginFor});if(!u)return;
    if(pinHash(d.pin||'',u.id)===u.pin){S.uid=u.id;S.loginFor=null;S.pinErr=false;S.tab='home';render()}
    else{S.pinErr=true;render();var i=$('#f-pin');if(i)i.focus()}}
};
var WRITE='task-new task-edit task-toggle journal-new journal-edit animal-new animal-edit health-new health-edit health-done feed-new feed-edit crop-new crop-edit act-new act-edit stock-new stock-edit move sale-new sale-edit exp-new exp-edit demo-clear'.split(' ');
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;if(RO()&&WRITE.indexOf(el.dataset.act)>=0){toast('Lecture seule : modification impossible.');return}var f=acts[el.dataset.act];if(f)f(el.dataset,el)});
document.addEventListener('submit',function(e){var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();var fn=forms[f.dataset.form];if(fn)fn(Object.fromEntries(new FormData(f).entries()),f)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

DB=load();loadSY();if(SY.on&&!DB){DB=EMPTY();SY.snap={};SY.meta={};SY.dirty={};SY.lastPull=0}
if(SY.on&&SY.role==='view')S.uid='__viewer__';else if(DB&&DB.users.length===1&&!DB.users[0].pin)S.uid=DB.users[0].id;
render();startSync();
})();
